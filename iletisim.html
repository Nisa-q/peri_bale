<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İletişim - Peri Bale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
    <img src="logo.jpg" alt="Peri Bale Logosu">
    <span id="peri-bale">Peri Bale</span>
</div>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="kurslar.html">Kurslar</a>
        <a href="iletisim.html">İletişim</a>
    </nav>
</header>

<section class="contact">
    <div class="contact-info">
        <h1>Bize Ulaş</h1>

        <p>
            Bale kurslarımız hakkında detaylı bilgi almak veya kayıt yaptırmak için
            formu doldurabilirsin.
        </p>

        <p><strong>Adres:</strong> Karabük Merkez</p>
        <p><strong>Telefon:</strong> 0555 123 45 67</p>
        <p><strong>E-posta:</strong> info@peribale.com</p>
    </div>

    <form>
        <label>Ad Soyad</label>
        <input type="text" placeholder="Adınızı giriniz">

        <label>E-posta</label>
        <input type="email" placeholder="E-posta adresinizi giriniz">

        <label>Yaş Grubu</label>
        <select>
            <option>4 - 6 Yaş</option>
            <option>7 - 10 Yaş</option>
            <option>11+ Yaş</option>
        </select>

        <label>Mesaj</label>
        <textarea placeholder="Mesajınızı yazınız"></textarea>

        <button type="submit">Gönder</button>
    </form>
</section>

<footer>
    <p>© 2026 Peri Bale Akademisi</p>
</footer>
<script src="app.js"></script>
</body>
</html>
